<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - PPG Maksel 2</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
        }

        /* Floating shapes animation */
        .floating-shape {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.06);
            animation: float 8s ease-in-out infinite;
        }

        .floating-shape:nth-child(2) {
            animation-delay: -2s;
            animation-duration: 10s;
        }

        .floating-shape:nth-child(3) {
            animation-delay: -4s;
            animation-duration: 12s;
        }

        .floating-shape:nth-child(4) {
            animation-delay: -1s;
            animation-duration: 9s;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) rotate(0deg);
                opacity: 0.6;
            }
            25% {
                transform: translateY(-20px) rotate(5deg);
                opacity: 0.8;
            }
            50% {
                transform: translateY(-35px) rotate(-3deg);
                opacity: 0.5;
            }
            75% {
                transform: translateY(-15px) rotate(2deg);
                opacity: 0.7;
            }
        }

        /* Glassmorphism card */
        .glass-card {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        /* Input focus glow */
        .input-glow:focus {
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15), 0 0 16px rgba(59, 130, 246, 0.08);
        }

        /* Button shine effect */
        .btn-shine {
            position: relative;
            overflow: hidden;
        }

        .btn-shine::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                to right,
                transparent 0%,
                rgba(255, 255, 255, 0.15) 50%,
                transparent 100%
            );
            transform: rotate(30deg);
            transition: all 0.6s ease;
            opacity: 0;
        }

        .btn-shine:hover::after {
            animation: shine 0.8s ease forwards;
        }

        @keyframes shine {
            0% {
                left: -100%;
                opacity: 1;
            }
            100% {
                left: 100%;
                opacity: 0;
            }
        }

        /* Pulse ring for logo */
        .logo-ring {
            animation: pulseRing 3s ease-in-out infinite;
        }

        @keyframes pulseRing {
            0%, 100% {
                box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.2);
            }
            50% {
                box-shadow: 0 0 0 12px rgba(255, 255, 255, 0);
            }
        }

        /* Fade-in on load */
        .fade-in-up {
            animation: fadeInUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
        }

        .fade-in-up-delay-1 { animation-delay: 0.1s; }
        .fade-in-up-delay-2 { animation-delay: 0.2s; }
        .fade-in-up-delay-3 { animation-delay: 0.35s; }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(24px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Password toggle */
        .password-toggle {
            transition: color 0.2s ease;
        }
        .password-toggle:hover {
            color: #2563eb;
        }

        /* Checkbox custom */
        .custom-checkbox {
            accent-color: #1d4ed8;
        }
    </style>
</head>

<body class="min-h-screen bg-gradient-to-br from-blue-700 via-blue-800 to-blue-900 relative overflow-x-hidden">

    <!-- Floating Background Shapes -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none" aria-hidden="true">
        <div class="floating-shape w-72 h-72 top-[-5%] left-[-8%]" style="opacity:0.5"></div>
        <div class="floating-shape w-96 h-96 bottom-[-10%] right-[-12%]" style="opacity:0.4"></div>
        <div class="floating-shape w-48 h-48 top-[40%] right-[5%]" style="opacity:0.3"></div>
        <div class="floating-shape w-32 h-32 bottom-[15%] left-[10%]" style="opacity:0.35"></div>
    </div>

    <!-- Subtle grid overlay -->
    <div class="absolute inset-0"
        style="background-image: radial-gradient(rgba(255,255,255,0.04) 1px, transparent 1px); background-size: 32px 32px;">
    </div>

    <div class="min-h-screen flex items-center justify-center px-4 py-8 relative z-10">

        <div class="w-full max-w-md">

            <!-- Brand Header (above card) -->
            <div class="text-center mb-8 fade-in-up">
                <div class="inline-flex items-center justify-center w-20 h-20 bg-white text-blue-700 rounded-2xl shadow-xl logo-ring mb-5">
                    <i class="fas fa-layer-group text-3xl"></i>
                </div>
                <h1 class="text-3xl font-bold text-white tracking-tight">
                    PPG Maksel 2
                </h1>
                <div class="flex items-center justify-center gap-2 mt-2">
                    <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                    <p class="text-sm text-blue-200 font-medium">
                        Sistem Generus Terpadu
                    </p>
                </div>
            </div>

            <!-- Login Card -->
            <div class="glass-card rounded-3xl shadow-2xl p-8 md:p-10 fade-in-up fade-in-up-delay-1">

                <!-- Card Header -->
                <div class="mb-7">
                    <h2 class="text-xl font-bold text-slate-800">
                        Selamat Datang! 👋
                    </h2>
                    <p class="text-sm text-slate-500 mt-1">
                        Masuk ke akun Anda untuk melanjutkan
                    </p>
                </div>

                <!-- Form -->
                <form id="loginForm">

                    <!-- Email -->
                    <div class="mb-5">
                        <label class="block text-sm font-semibold text-slate-700 mb-2">
                            <i class="fas fa-envelope text-blue-600 mr-1.5 text-xs"></i>
                            Email
                        </label>
                        <div class="relative">
                            <input type="email" id="emailInput" placeholder="Masukkan email Anda"
                                class="input-glow w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3.5 text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:border-blue-500 focus:bg-white transition-all duration-200">
                        </div>
                    </div>

                    <!-- Password -->
                    <div class="mb-5">
                        <label class="block text-sm font-semibold text-slate-700 mb-2">
                            <i class="fas fa-lock text-blue-600 mr-1.5 text-xs"></i>
                            Password
                        </label>
                        <div class="relative">
                            <input type="password" id="passwordInput" placeholder="Masukkan password Anda"
                                class="input-glow w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3.5 pr-12 text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:border-blue-500 focus:bg-white transition-all duration-200">
                            <button type="button" onclick="togglePassword()"
                                class="password-toggle absolute right-4 top-1/2 -translate-y-1/2 text-slate-400">
                                <i class="fas fa-eye" id="eyeIcon"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Remember & Forgot -->
                    <div class="flex justify-between items-center mb-7">
                        <label class="flex items-center gap-2.5 text-sm text-slate-600 cursor-pointer select-none">
                            <input type="checkbox" class="custom-checkbox w-4 h-4 rounded">
                            <span>Ingat Saya</span>
                        </label>
                        <a href="lupa_password.html"
                            class="text-sm text-blue-700 font-medium hover:text-blue-800 hover:underline transition">
                            Lupa Password?
                        </a>
                    </div>

                    <!-- Login Button -->
                    <button type="submit" id="loginButton"
                        class="btn-shine flex items-center justify-center gap-2.5 w-full bg-gradient-to-r from-blue-700 to-blue-800 hover:from-blue-800 hover:to-blue-900 text-white py-3.5 rounded-xl font-semibold text-sm shadow-lg shadow-blue-700/25 hover:shadow-blue-800/30 transition-all duration-300 transform hover:-translate-y-0.5">
                        <i class="fas fa-sign-in-alt text-sm"></i>
                        <span>Masuk ke Sistem</span>
                    </button>
                    <p id="loginError" class="hidden mt-3 text-sm text-red-600" role="alert"></p>

                </form>

            </div>

            <!-- Footer (below card) -->
            <div class="text-center mt-7 fade-in-up fade-in-up-delay-3">
                <div class="inline-flex items-center gap-2 bg-blue-800/40 backdrop-blur-sm border border-blue-600/30 text-blue-200 text-xs font-medium px-4 py-2 rounded-full">
                    <i class="fas fa-shield-alt text-[10px]"></i>
                    <span>Wilayah Maksel 2 • Tahun 2026/2027</span>
                </div>
                <p class="text-blue-300/60 text-xs mt-3">
                    © 2026 PPG Maksel 2 — Sistem Informasi Generus
                </p>
            </div>

        </div>

    </div>

    <script src="assets/config.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/supabase-client.js"></script>
    <script>
        // Toggle password visibility
        function togglePassword() {
            const input = document.getElementById('passwordInput');
            const icon = document.getElementById('eyeIcon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        document.getElementById('loginForm').addEventListener('submit', async (event) => {
            event.preventDefault();
            const email=document.getElementById('emailInput').value.trim();
            const password=document.getElementById('passwordInput').value;
            const button=document.getElementById('loginButton');
            const errorBox=document.getElementById('loginError');
            errorBox.classList.add('hidden');
            if(!email || !password){errorBox.textContent='Email dan password wajib diisi.';errorBox.classList.remove('hidden');return;}
            button.disabled=true;button.classList.add('opacity-60');button.querySelector('span').textContent='Memverifikasi...';
            try { await window.PPG_DB.auth.signIn(email,password); window.location.href='dashboard.html'; }
            catch(error){errorBox.textContent=error.message||'Login gagal. Periksa kembali akun Anda.';errorBox.classList.remove('hidden');}
            finally{button.disabled=false;button.classList.remove('opacity-60');button.querySelector('span').textContent='Masuk ke Sistem';}
        });
    </script>

</body>

</html>
